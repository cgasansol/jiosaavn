<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioSaavn</title>
    <!-- मैनिफेस्ट फाइल को लिंक करना -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2bc8ae">
    <style>
        /* मार्जिन हटाकर फुल स्क्रीन व्यू देना */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- JioSaavn को ऐप के अंदर खोलने के लिए iframe -->
    <iframe src="https://www.jiosaavn.com/" allow="autoplay; encrypted-media"></iframe>

    <script>
        // सर्विस वर्कर को रजिस्टर करना ताकि इंस्टॉल का प्रॉम्प्ट आ सके
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker रजिस्टर्ड हो गया है:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker रजिस्ट्रेशन फेल हुआ:', error);
                    });
            });
        }
    </script>
</body>
</html>
